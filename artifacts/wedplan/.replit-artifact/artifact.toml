kind = "web"
previewPath = "/"
title = "WedPlan Wedding Platform"
description = "A wedding guest and event management platform for creating beautiful guest experiences, collecting RSVPs, coordinating Aso Ebi orders, tracking payments, and communicating with invited guests."
version = "1.0.0"
id = "artifacts/wedplan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24422

[services.development]
run = "pnpm --filter @workspace/backend run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/backend", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"

[services.production.run]
args = [ "node", "--env-file-if-exists=.env", "--enable-source-maps", "artifacts/wedplan/backend/dist/index.mjs" ]

[services.production.run.env]
PORT = "24422"
NODE_ENV = "production"
BASE_PATH = "/"

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "24422"
BASE_PATH = "/"
