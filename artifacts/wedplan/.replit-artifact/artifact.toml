kind = "web"
previewPath = "/"
title = "WedPlan Wedding Platform"
description = "A wedding planning and guest RSVP platform with an admin dashboard, asoebi shopping, and secure payment collection for couples and their guests."
version = "1.0.0"
id = "artifacts/wedplan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24422

[services.development]
run = "pnpm --filter @workspace/wedplan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wedplan", "run", "build" ]
serve = "static"
publicDir = "artifacts/wedplan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24422"
BASE_PATH = "/"
