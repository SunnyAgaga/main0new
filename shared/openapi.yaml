openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WedPlan wedding RSVP and asoebi commerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: event
    description: Public wedding event details
  - name: asoebi
    description: Asoebi catalog
  - name: rsvp
    description: Guest RSVP submissions
  - name: checkout
    description: Payment checkout
  - name: admin
    description: Authenticated dashboard administration
  - name: auth
    description: Admin account authentication
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in to an admin account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out of the current session
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the current admin session
      responses:
        "200":
          description: Current admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /event:
    get:
      operationId: getEvent
      tags: [event]
      summary: Get wedding event details
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /admin/event:
    put:
      operationId: updateEvent
      tags: [admin]
      summary: Update wedding event details (admin role only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Updated event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /asoebi:
    get:
      operationId: listAsoebi
      tags: [asoebi]
      summary: List available asoebi items
      responses:
        "200":
          description: Available asoebi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AsoebiItem"
  /admin/asoebi:
    post:
      operationId: createAsoebiItem
      tags: [admin]
      summary: Create an asoebi catalog item (admin role only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsoebiItemInput"
      responses:
        "201":
          description: Asoebi item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsoebiItem"
        "400":
          description: Invalid asoebi item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/asoebi/{id}:
    put:
      operationId: updateAsoebiItem
      tags: [admin]
      summary: Update an asoebi catalog item (admin role only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsoebiItemInput"
      responses:
        "200":
          description: Updated asoebi item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsoebiItem"
        "400":
          description: Invalid asoebi item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asoebi item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAsoebiItem
      tags: [admin]
      summary: Remove an asoebi catalog item (admin role only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Asoebi item removed
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asoebi item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rsvps:
    post:
      operationId: createRsvp
      tags: [rsvp]
      summary: Submit a guest RSVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpInput"
      responses:
        "201":
          description: RSVP submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpResult"
        "400":
          description: Invalid RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/flutterwave:
    post:
      operationId: startFlutterwaveCheckout
      tags: [checkout]
      summary: Create a Flutterwave checkout link for an RSVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Flutterwave checkout link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Invalid checkout request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Flutterwave is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/bank-transfer:
    post:
      operationId: createBankTransferOrder
      tags: [checkout]
      summary: Create a bank transfer order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Bank transfer instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransferResponse"
        "400":
          description: Invalid checkout request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bank transfer is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/gift/flutterwave:
    post:
      operationId: startGiftFlutterwaveCheckout
      tags: [checkout]
      summary: Create a Flutterwave checkout link for a monetary gift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftCheckoutInput"
      responses:
        "200":
          description: Flutterwave checkout link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Invalid gift request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Flutterwave is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/gift/bank-transfer:
    post:
      operationId: createGiftBankTransferOrder
      tags: [checkout]
      summary: Create a bank transfer order for a monetary gift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftCheckoutInput"
      responses:
        "201":
          description: Bank transfer instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransferResponse"
        "400":
          description: Invalid gift request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bank transfer is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/verify:
    post:
      operationId: verifyCheckout
      tags: [checkout]
      summary: Verify a Flutterwave transaction directly with Flutterwave and sync the order's status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCheckoutInput"
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatus"
        "400":
          description: Invalid verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/payment-config:
    get:
      operationId: getPaymentConfig
      tags: [admin]
      summary: Get safe payment configuration status
      responses:
        "200":
          description: Payment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfig"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePaymentConfig
      tags: [admin]
      summary: Update payment configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentConfigInput"
      responses:
        "200":
          description: Updated payment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfig"
        "400":
          description: Invalid payment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List admin users (admin role only)
      responses:
        "200":
          description: Admin users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create a new admin user (admin role only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserInput"
      responses:
        "201":
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}:
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Remove an admin user (admin role only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Admin user removed
        "400":
          description: Cannot remove your own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Admin user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List all orders/transactions (admin role only)
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/rsvps:
    get:
      operationId: listAdminRsvps
      tags: [admin]
      summary: List all RSVPs (admin role only)
      responses:
        "200":
          description: RSVPs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRsvp"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/rsvps/{id}:
    put:
      operationId: updateAdminRsvp
      tags: [admin]
      summary: Update a guest's RSVP (admin role only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpInput"
      responses:
        "200":
          description: Updated RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRsvp"
        "400":
          description: Invalid RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: RSVP not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /delivery-options:
    get:
      operationId: getDeliveryOptions
      tags: [event]
      summary: Get public delivery options (pickup, fee, enabled providers)
      responses:
        "200":
          description: Delivery options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDeliveryOptions"
  /admin/delivery-config:
    get:
      operationId: getDeliveryConfig
      tags: [admin]
      summary: Get safe delivery configuration status
      responses:
        "200":
          description: Delivery configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryConfig"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateDeliveryConfig
      tags: [admin]
      summary: Update delivery configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryConfigInput"
      responses:
        "200":
          description: Updated delivery configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryConfig"
        "400":
          description: Invalid delivery configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/notification-config:
    get:
      operationId: getNotificationConfig
      tags: [admin]
      summary: Get safe notification configuration status
      responses:
        "200":
          description: Notification configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationConfig"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateNotificationConfig
      tags: [admin]
      summary: Update notification configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationConfigInput"
      responses:
        "200":
          description: Updated notification configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationConfig"
        "400":
          description: Invalid notification configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rsvp-form-copy:
    get:
      operationId: getRsvpFormCopy
      tags: [event]
      summary: Get the editable text shown on the public RSVP form
      responses:
        "200":
          description: RSVP form copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpFormCopy"
  /admin/rsvp-form-copy:
    put:
      operationId: updateRsvpFormCopy
      tags: [admin]
      summary: Update the text shown on the public RSVP form (admin role only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpFormCopyInput"
      responses:
        "200":
          description: Updated RSVP form copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpFormCopy"
        "400":
          description: Invalid RSVP form copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment-methods:
    get:
      operationId: getPaymentMethods
      tags: [event]
      summary: Get which payment methods guests can currently use
      responses:
        "200":
          description: Available payment methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethods"
  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [event]
      summary: Get public site settings (music playlist)
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /admin/site-settings:
    put:
      operationId: updateSiteSettings
      tags: [admin]
      summary: Update site settings (music playlist)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsInput"
      responses:
        "200":
          description: Updated site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Invalid site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/spotify-config:
    get:
      operationId: getSpotifyConfig
      tags: [admin]
      summary: Get Spotify connection status (admin role only)
      responses:
        "200":
          description: Spotify configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifyConfig"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateSpotifyConfig
      tags: [admin]
      summary: Save Spotify app credentials (admin role only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotifyConfigInput"
      responses:
        "200":
          description: Updated Spotify configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifyConfig"
        "400":
          description: Invalid Spotify configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/spotify/playlists:
    get:
      operationId: listSpotifyPlaylists
      tags: [admin]
      summary: List the connected Spotify account's playlists (admin role only)
      responses:
        "200":
          description: Spotify playlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpotifyPlaylist"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Spotify is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/spotify/import/{playlistId}:
    post:
      operationId: importSpotifyPlaylist
      tags: [admin]
      summary: Import 30-second previews from a Spotify playlist into the site playlist (admin role only)
      parameters:
        - name: playlistId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated site settings with imported tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Spotify is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
