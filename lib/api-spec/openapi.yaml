openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WedPlan wedding RSVP and asoebi commerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: event
    description: Public wedding event details
  - name: asoebi
    description: Asoebi catalog
  - name: rsvp
    description: Guest RSVP submissions
  - name: checkout
    description: Payment checkout
  - name: admin
    description: Authenticated dashboard administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /event:
    get:
      operationId: getEvent
      tags: [event]
      summary: Get wedding event details
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /asoebi:
    get:
      operationId: listAsoebi
      tags: [asoebi]
      summary: List available asoebi items
      responses:
        "200":
          description: Available asoebi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AsoebiItem"
  /rsvps:
    post:
      operationId: createRsvp
      tags: [rsvp]
      summary: Submit a guest RSVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpInput"
      responses:
        "201":
          description: RSVP submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpResult"
        "400":
          description: Invalid RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/flutterwave:
    post:
      operationId: startFlutterwaveCheckout
      tags: [checkout]
      summary: Create a Flutterwave checkout link for an RSVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Flutterwave checkout link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Invalid checkout request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Flutterwave is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/bank-transfer:
    post:
      operationId: createBankTransferOrder
      tags: [checkout]
      summary: Create a bank transfer order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Bank transfer instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransferResponse"
        "400":
          description: Invalid checkout request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bank transfer is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/payment-config:
    get:
      operationId: getPaymentConfig
      tags: [admin]
      summary: Get safe payment configuration status
      responses:
        "200":
          description: Payment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfig"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePaymentConfig
      tags: [admin]
      summary: Update payment configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentConfigInput"
      responses:
        "200":
          description: Updated payment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfig"
        "400":
          description: Invalid payment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Event:
      type: object
      required: [id, coupleNames, date, venue, rsvpDeadline, welcomeMessage]
      properties:
        id: { type: string }
        coupleNames: { type: string }
        date: { type: string }
        venue: { type: string }
        rsvpDeadline: { type: string }
        welcomeMessage: { type: string }
    AsoebiItem:
      type: object
      required: [id, name, description, price, currency, imageUrl, sizes, available]
      properties:
        id: { type: number }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        currency: { type: string }
        imageUrl: { type: string }
        sizes:
          type: array
          items: { type: string }
        available: { type: boolean }
    RsvpInput:
      type: object
      required: [guestName, email, attending, asoebiInterest]
      properties:
        guestName: { type: string, minLength: 2 }
        email: { type: string }
        phone: { type: string }
        attending: { type: boolean }
        guestCount: { type: number, minimum: 1, maximum: 10 }
        asoebiInterest:
          type: string
          enum: [yes, no]
        asoebiItemId: { type: ["number", "null"] }
        asoebiSize: { type: ["string", "null"] }
        note: { type: string }
    RsvpResult:
      type: object
      required: [id, guestName, email, attending, asoebiInterest, nextStep]
      properties:
        id: { type: number }
        guestName: { type: string }
        email: { type: string }
        attending: { type: boolean }
        asoebiInterest: { type: string, enum: [yes, no] }
        nextStep: { type: string, enum: [complete, cart] }
        cartItem:
          type: ["object", "null"]
          properties:
            id: { type: number }
            name: { type: string }
            price: { type: number }
            currency: { type: string }
            size: { type: string }
          required: [id, name, price, currency, size]
    CheckoutInput:
      type: object
      required: [rsvpId, guestName, email, itemId, size]
      properties:
        rsvpId: { type: number }
        guestName: { type: string }
        email: { type: string }
        itemId: { type: number }
        size: { type: string }
        amount: { type: number, minimum: 0 }
    CheckoutResponse:
      type: object
      required: [reference, checkoutUrl]
      properties:
        reference: { type: string }
        checkoutUrl: { type: string }
    BankTransferResponse:
      type: object
      required: [reference, amount, currency, bankName, accountName, accountNumber, instructions]
      properties:
        reference: { type: string }
        amount: { type: number }
        currency: { type: string }
        bankName: { type: string }
        accountName: { type: string }
        accountNumber: { type: string }
        instructions: { type: string }
    PaymentConfig:
      type: object
      required: [flutterwaveConfigured, bankTransferConfigured, flutterwaveKeyHint, bankTransfer]
      properties:
        flutterwaveConfigured: { type: boolean }
        flutterwaveKeyHint: { type: string }
        bankTransferConfigured: { type: boolean }
        bankTransfer:
          $ref: "#/components/schemas/BankTransferDetails"
    PaymentConfigInput:
      type: object
      required: [flutterwaveEnabled, flutterwaveSecretKey, bankTransferEnabled, bankTransfer]
      properties:
        flutterwaveEnabled: { type: boolean }
        flutterwaveSecretKey: { type: string }
        bankTransferEnabled: { type: boolean }
        bankTransfer:
          $ref: "#/components/schemas/BankTransferDetails"
    BankTransferDetails:
      type: object
      required: [bankName, accountName, accountNumber, instructions]
      properties:
        bankName: { type: string }
        accountName: { type: string }
        accountNumber: { type: string }
        instructions: { type: string }
    AdminOverview:
      type: object
      required: [totalRsvps, attendingCount, asoebiInterestCount, paidOrders, recentRsvps]
      properties:
        totalRsvps: { type: number }
        attendingCount: { type: number }
        asoebiInterestCount: { type: number }
        paidOrders: { type: number }
        recentRsvps:
          type: array
          items:
            $ref: "#/components/schemas/RecentRsvp"
    RecentRsvp:
      type: object
      required: [guestName, attending, asoebiInterest, createdAt]
      properties:
        guestName: { type: string }
        attending: { type: boolean }
        asoebiInterest: { type: string, enum: [yes, no] }
        createdAt: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

